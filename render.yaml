services:
  # ── Backend: Express + Socket.IO ────────────────────────────────────────
  - type: web
    name: pacpac-chat-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Update these two to match the actual frontend URL Render assigns
      # (predictable as https://<frontend service name>.onrender.com unless
      # that name is already taken, in which case Render appends a suffix).
      - key: CLIENT_URL
        value: https://pacpac-chat-frontend.onrender.com
      - key: SERVER_URL
        value: https://realtime-chatapp-1-srxf.onrender.com

  # ── Frontend: Next.js (SSR + middleware, needs a Node server) ──────────
  - type: web
    name: pacpac-chat-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Same-origin via Next rewrites → refreshToken cookie lands on the
      # frontend's own domain, which is what middleware.ts checks. Direct
      # cross-origin calls to the backend leave that cookie invisible to
      # the frontend's server and the login redirect never fires.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: ""
      - key: BACKEND_INTERNAL_URL
        value: https://realtime-chatapp-1-srxf.onrender.com
      - key: NEXT_PUBLIC_WEBRTC_STUN_URLS
        value: stun:stun.l.google.com:19302
